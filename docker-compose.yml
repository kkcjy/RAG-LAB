# ---------------------------------------------------------------------------
#  RAG-LAB 一键编排
#  后端 + PostgreSQL + Qdrant + Redis
#  启动： docker compose up -d --build
#  查看： docker compose ps
#  日志： docker compose logs -f backend
# ---------------------------------------------------------------------------
name: rag-lab

services:
  # ---------------------------------------------------------------- 后端
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-lab-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/logs:/app/data/logs
      - ./data/hf_cache:/app/data/hf_cache      # BGE 模型缓存，避免重启重下
      # 说明：
      #   代码默认使用镜像内版本。本地开发热更新请用:
      #     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
      #   HF_ENDPOINT / HF_HOME 由 .env 提供，此处不重复定义
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag-lab-net
    extra_hosts:
      - "host.docker.internal:host-gateway"      # 访问宿主机上的 vLLM

  # ------------------------------------------------------------ PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: rag-lab-postgres
    restart: unless-stopped
    environment:
      # 注意：POSTGRES_USER/DB 保持 raglab 不变。
      # 这两个值只在数据卷首次初始化时生效，改动会导致已有数据不可读。
      POSTGRES_USER: ${POSTGRES_USER:-raglab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raglab_pass_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-raglab}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raglab} -d ${POSTGRES_DB:-raglab}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rag-lab-net

  # ---------------------------------------------------------------- Qdrant
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag-lab-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rag-lab-net

  # ----------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    container_name: rag-lab-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag-lab-net

volumes:
  # 卷名已从 raglab-* 迁移为 rag-lab-*（数据已复制保留）
  # 这三个卷由历史迁移手工创建、不带 Compose 标签，
  # 因此声明为 external，避免每次 up 都告警 "not created by Docker Compose"。
  # external 卷不会在 `docker compose down -v` 时被删除，数据更安全。
  pgdata:
    name: rag-lab-pgdata
    external: true
  qdrant_data:
    name: rag-lab-qdrant-data
    external: true
  redis_data:
    name: rag-lab-redis-data
    external: true

networks:
  rag-lab-net:
    name: rag-lab-net
    driver: bridge
